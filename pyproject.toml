[project]
name = "razorpay-finance-recon"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "minio>=7.2.20",
    "openai>=3.7.0",
    "playwright>=1.62.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "razorpay>=2.0.1",
    "uvicorn>=0.52.4",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "recon"
module-root = "src"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
